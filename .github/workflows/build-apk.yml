name: Build Fold7 Theme APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build v0.4.2 Roxy PNG fix
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify generated Roxy PNG
        run: |
          test -s app/src/main/res/drawable-nodpi/roxy_wallpaper.png
          file app/src/main/res/drawable-nodpi/roxy_wallpaper.png
      - name: Rename v0.4.2 Roxy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MushokuFoldTheme-v0.4.2-RoxyFix-debug.apk
      - name: Upload v0.4.2 Roxy APK
        uses: actions/upload-artifact@v4
        with:
          name: MushokuFoldTheme-v0.4.2-RoxyFix
          path: app/build/outputs/apk/debug/MushokuFoldTheme-v0.4.2-RoxyFix-debug.apk
