import javax.imageio.ImageIO
import java.awt.RenderingHints
import java.awt.image.BufferedImage

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.otakuhoarder.mushokufoldtheme'
    compileSdk 36

    defaultConfig {
        applicationId 'com.otakuhoarder.mushokufoldtheme'
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName '0.4.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Android was showing the source JPEG as a black preview on-device.
// Convert it during every build to a baseline, no-density PNG that Android can
// decode consistently, and upscale it to the Roxy Edition working resolution.
tasks.register('prepareRoxyWallpaper') {
    doLast {
        File input = file('src/main/res/drawable/roxy_theme.jpg')
        File outputDir = file('src/main/res/drawable-nodpi')
        File output = new File(outputDir, 'roxy_wallpaper.png')

        if (!input.exists()) {
            throw new GradleException('Missing Roxy source artwork: ' + input)
        }

        BufferedImage source = ImageIO.read(input)
        if (source == null) {
            throw new GradleException('JDK ImageIO could not decode the Roxy JPEG')
        }

        outputDir.mkdirs()
        int targetWidth = 1080
        int targetHeight = 1920
        BufferedImage scaled = new BufferedImage(targetWidth, targetHeight, BufferedImage.TYPE_INT_RGB)
        def graphics = scaled.createGraphics()
        try {
            graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
            graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            graphics.drawImage(source, 0, 0, targetWidth, targetHeight, null)
        } finally {
            graphics.dispose()
        }

        if (!ImageIO.write(scaled, 'png', output)) {
            throw new GradleException('Could not write generated Roxy PNG')
        }
        println "Generated ${output} (${targetWidth}x${targetHeight})"
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareRoxyWallpaper')
}
